name: Container

on:
  push:
    branches:
      - dev
      - val
      - prod
    tags:
      - "v*"
  pull_request:
    branches:
      - dev
      - val
      - prod
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  READAIRR_DEV_VERSION_BASE: 1.1.0
  READAIRR_STABLE_VERSION_BASE: 1.0.0

jobs:
  build:
    name: Build image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare image name
        id: image
        run: echo "name=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev' }}
            type=raw,value=val,enable=${{ github.ref == 'refs/heads/val' }}
            type=raw,value=prod,enable=${{ github.ref == 'refs/heads/prod' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/prod' }}
            type=raw,value=1,enable=${{ github.ref == 'refs/heads/prod' }}
            type=raw,value=1.0,enable=${{ github.ref == 'refs/heads/prod' }}
            type=ref,event=tag
            type=sha,prefix={{branch}}-
          labels: |
            org.opencontainers.image.title=ReadAIrr
            org.opencontainers.image.description=ReadAIrr container image built from this fork
            org.opencontainers.image.licenses=GPL-3.0
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Select release version base
        id: version
        shell: bash
        run: |
          target_ref="${GITHUB_BASE_REF:-$GITHUB_REF_NAME}"

          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" == v* ]]; then
            version_base="${GITHUB_REF_NAME#v}"
          elif [[ "$target_ref" == "dev" ]]; then
            version_base="$READAIRR_DEV_VERSION_BASE"
          else
            version_base="$READAIRR_STABLE_VERSION_BASE"
          fi

          echo "base=$version_base" >> "$GITHUB_OUTPUT"
          echo "ReadAIrr version base: $version_base"

      - name: Build and publish image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: |
            BUILD_SOURCEBRANCHNAME=${{ github.ref_name }}
            READARR_VERSION=${{ steps.version.outputs.base }}.${{ github.run_number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
